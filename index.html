<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
<meta name="theme-color" content="#f7f5f2" />
<meta name="description" content="Tap to count tennis serves, review sessions, and track your practice on a calendar." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ServeApp" />
<title>ServeApp — Tennis Serve Counter</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="glow"></span>
    <span class="glow-2"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-ball" aria-hidden="true">
        <svg class="brand-ball-seam" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50,-6 C1,29 99,71 50,106" transform="rotate(24 50 50)"
            fill="none" stroke="#fafcf5" stroke-width="9" stroke-linecap="round" opacity="0.85" />
        </svg>
      </span>
      <div>
        <h1>ServeApp</h1>
        <p id="topbarSub">Tap. Track. Improve.</p>
      </div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Data menu" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
  </header>

  <main id="views">
    <!-- ── COUNT ───────────────────────────────────────────── -->
    <section class="view is-active" id="view-count" aria-label="Counter">
      <div class="session-strip" id="sessionStrip">
        <div class="strip-left">
          <span class="pulse-dot" id="liveDot" aria-hidden="true"></span>
          <div>
            <div class="strip-title" id="sessionName">No active session</div>
            <div class="strip-meta"><span id="sessionClock">00:00</span> · <span id="sessionRate">0.0 / min</span></div>
          </div>
        </div>
        <div class="strip-right">
          <button class="ghost-btn" id="endSessionBtn" hidden>End</button>
          <svg class="strip-chevron row-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </div>
      </div>

      <div class="counter-wrap">
        <button class="overheads-btn" id="overheadsBtn" aria-label="Count one overhead">
          <span class="overheads-count" id="overheadsCount">0</span>
          <span class="overheads-label">OVERHEADS</span>
        </button>
        <div class="ring-stack">
          <button class="tap-btn" id="tapBtn" aria-label="Count one serve">
            <svg class="tap-seam" viewBox="0 0 100 100" aria-hidden="true">
              <path d="M50,-6 C1,29 99,71 50,106" transform="rotate(24 50 50)"
                fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" opacity="0.18" />
            </svg>
            <div class="tap-content">
              <span class="tap-count" id="tapCount">0</span>
              <span class="tap-label">SERVES</span>
              <span class="tap-hint" id="tapHint">tap anywhere in the circle</span>
            </div>
          </button>
          <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
        </div>
      </div>

      <div class="action-row" id="actionRow">
        <button class="pill-btn danger" id="undoBtn" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14H8"/></svg>
          Undo
        </button>
        <button class="pill-btn" id="newSessionBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="newSessionIcon"><path d="M12 5v14M5 12h14"/></svg>
          New session
        </button>
      </div>

      <div class="mini-stats">
        <div class="mini-card"><span class="mini-num" id="statToday">0</span><span class="mini-lbl">Today</span></div>
        <div class="mini-card"><span class="mini-num" id="statSessionsToday">0</span><span class="mini-lbl">Sessions today</span></div>
        <div class="mini-card"><span class="mini-num" id="statAll">0</span><span class="mini-lbl">All time</span></div>
      </div>
    </section>

    <!-- ── SESSIONS ────────────────────────────────────────── -->
    <section class="view" id="view-sessions" aria-label="Sessions">
      <div class="view-head">
        <h2>Sessions</h2>
        <span class="chip" id="sessionsCount">0</span>
      </div>
      <div id="sessionList" class="session-list"></div>
    </section>

    <!-- ── CALENDAR ────────────────────────────────────────── -->
    <section class="view" id="view-calendar" aria-label="Calendar">
      <div class="cal-head">
        <button class="icon-btn sm" id="prevMonth" aria-label="Previous month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <div class="cal-title">
          <h2 id="calMonth">Month</h2>
          <p id="calSummary">—</p>
        </div>
        <button class="icon-btn sm" id="nextMonth" aria-label="Next month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>
      <div class="cal-dow" aria-hidden="true">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span>Less</span>
        <i class="lvl lvl-0"></i><i class="lvl lvl-1"></i><i class="lvl lvl-2"></i><i class="lvl lvl-3"></i><i class="lvl lvl-4"></i>
        <span>More</span>
      </div>
      <div id="dayPanel" class="day-panel"></div>
    </section>

    <!-- ── STATS ───────────────────────────────────────────── -->
    <section class="view" id="view-stats" aria-label="Stats">
      <div class="view-head"><h2>Stats</h2></div>
      <div class="stat-grid">
        <div class="stat-card"><span class="stat-num" id="sTotal">0</span><span class="stat-lbl">Total serves</span></div>
        <div class="stat-card"><span class="stat-num" id="sSessions">0</span><span class="stat-lbl">Sessions</span></div>
        <div class="stat-card"><span class="stat-num" id="sAvg">0</span><span class="stat-lbl">Avg / session</span></div>
        <div class="stat-card"><span class="stat-num" id="sBest">0</span><span class="stat-lbl">Best day</span></div>
        <div class="stat-card"><span class="stat-num" id="sDays">0</span><span class="stat-lbl">Active days</span></div>
        <div class="stat-card"><span class="stat-num" id="sStreak">0</span><span class="stat-lbl">Day streak</span></div>
        <div class="stat-card"><span class="stat-num" id="sOverheads">0</span><span class="stat-lbl">Overheads</span></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Last 14 days</h3><span class="chip" id="chartTotal">0</span></div>
        <div class="chart" id="chart"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Personal bests</h3></div>
        <ul class="best-list" id="bestList"></ul>
      </div>
    </section>
  </main>

  <nav class="tabbar" role="tablist">
    <button class="tab is-active" data-view="count" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M4 7c4 2 6 5 6 10M20 7c-4 2-6 5-6 10"/></svg>
      <span>Count</span>
    </button>
    <button class="tab" data-view="sessions" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Sessions</span>
    </button>
    <button class="tab" data-view="calendar" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span>Calendar</span>
    </button>
    <button class="tab" data-view="stats" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grabber" id="sheetGrabber" aria-hidden="true"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
